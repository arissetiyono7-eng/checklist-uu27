<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12875d">
<meta name="description" content="KerjaKu — To Do, Tugas, dan Notes yang tetap jalan tanpa internet.">
<title>KerjaKu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --line:#ebe8e0; --text:#151c2c; --muted:#6b7280; --faint:#9ca3af;
  --green:#12875d; --green-strong:#0e7a53; --green-soft:#e7f4ee; --green-line:#c5e6d6;
  --blue:#2563eb; --blue-soft:#eaf0fe;
  --orange:#d2830a; --orange-soft:#fdf3e2;
  --red:#d61f3c; --red-soft:#fdecef; --red-line:#f8cdd5;
  --yellow:#a87406; --yellow-soft:#fff7d6; --yellow-line:#f6e39a;
  --mint:#e6f6ef; --mint-line:#bfe5d2;
  --chip:#f3f3ef; --item:#fbfaf7;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.03);
  --n-yellow:#fff6d5; --n-blue:#e7effe; --n-green:#e4f5ec; --n-pink:#fde8ef; --n-purple:#efe9fd; --n-white:#ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1311; --card:#161c1a; --line:#25302b; --text:#eef2f0; --muted:#9aa6a0; --faint:#6f7b75;
    --green:#2bb07f; --green-strong:#22a173; --green-soft:#16302a; --green-line:#24503f;
    --blue:#6b9bff; --blue-soft:#1a2440;
    --orange:#f0a83a; --orange-soft:#33280f;
    --red:#ff6b82; --red-soft:#3a1820; --red-line:#5a2430;
    --yellow:#f2c94c; --yellow-soft:#332a10; --yellow-line:#4f4214;
    --mint:#15302a; --mint-line:#24503f;
    --chip:#1d2522; --item:#1a211f;
    --shadow:none;
    --n-yellow:#33301a; --n-blue:#1b2640; --n-green:#17302a; --n-pink:#3a1d29; --n-purple:#291f40; --n-white:#1d2522;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1311; --card:#161c1a; --line:#25302b; --text:#eef2f0; --muted:#9aa6a0; --faint:#6f7b75;
  --green:#2bb07f; --green-strong:#22a173; --green-soft:#16302a; --green-line:#24503f;
  --blue:#6b9bff; --blue-soft:#1a2440;
  --orange:#f0a83a; --orange-soft:#33280f;
  --red:#ff6b82; --red-soft:#3a1820; --red-line:#5a2430;
  --yellow:#f2c94c; --yellow-soft:#332a10; --yellow-line:#4f4214;
  --mint:#15302a; --mint-line:#24503f;
  --chip:#1d2522; --item:#1a211f;
  --shadow:none;
  --n-yellow:#33301a; --n-blue:#1b2640; --n-green:#17302a; --n-pink:#3a1d29; --n-purple:#291f40; --n-white:#1d2522;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:46px;height:46px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.logo svg.i{width:24px;height:24px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:19px;white-space:nowrap;font-weight:700;letter-spacing:-.2px}
.status{display:flex;white-space:nowrap;align-items:center;gap:6px;font-size:13px;color:var(--green);font-weight:500}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.off{color:var(--orange)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;flex:none}
.icon-btn:active{transform:scale(.95)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:#ef4060;border:2px solid var(--card);display:none}
.icon-btn .dot.on{display:block}
.actions{display:flex;gap:8px}

main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--green)}
.hello{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:6px 0 4px;line-height:1.15}
.sub{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.stat{display:block;width:100%;background:var(--chip);border:1px solid var(--line);border-radius:18px;padding:14px 4px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:var(--text);opacity:.85}
.stat.s-todo b{color:var(--green)} .stat.s-task b{color:var(--blue)} .stat.s-note b{color:var(--orange)}
.stat.done{background:var(--mint);border-color:var(--mint-line)} .stat.done b,.stat.done span{color:var(--green)}

.section-label{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 10px 6px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.qa{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:600;box-shadow:var(--shadow)}
.qa svg.i{width:20px;height:20px}
.qa.s-todo{color:var(--green)} .qa.s-task{color:var(--blue)} .qa.s-note{color:var(--orange)}
.qa:active{transform:scale(.97)}

.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head h2{font-size:19px;font-weight:700;margin:0;flex:1;letter-spacing:-.2px}
.card-head .count{color:var(--muted);font-size:14px}
.card-head .live{width:10px;height:10px;border-radius:50%;background:var(--green)}
.card-head .pin{color:var(--green)}
.card-head .pin svg.i{width:18px;height:18px;fill:currentColor}
.link{color:var(--green);font-weight:600;font-size:14px}

/* To Do item */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);background:var(--item);border-radius:18px;width:100%;text-align:left}
.check{width:26px;height:26px;border-radius:6px;border:2px solid var(--faint);flex:none;display:grid;place-items:center;color:#fff}
.check svg.i{width:16px;height:16px;stroke-width:3;opacity:0}
.item.done .check{background:var(--green);border-color:var(--green)}
.item.done .check svg.i{opacity:1}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item .body{flex:1;min-width:0}
.item .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin-top:3px;flex-wrap:wrap}
.meta .sep{width:3px;height:3px;border-radius:50%;background:currentColor}
.meta.late{color:var(--red)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:9px;border:1px solid;white-space:nowrap;flex:none}
.badge::before{content:"";width:13px;height:13px;border-radius:50%;background:currentColor}
.badge.tinggi{color:var(--red);background:var(--red-soft);border-color:var(--red-line)}
.badge.sedang{color:var(--yellow);background:var(--yellow-soft);border-color:var(--yellow-line)}
.badge.rendah{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.badge.tinggi::before{background:#e5243f} .badge.sedang::before{background:#f2c11d} .badge.rendah::before{background:#1fae74}

/* Tugas */
.task{display:block;width:100%;text-align:left;padding:16px;border:1px solid var(--line);background:var(--item);border-radius:18px}
.task-top{display:flex;align-items:flex-start;gap:10px}
.task-top .t{flex:1;font-weight:600;font-size:16px}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .desc{color:var(--muted);font-size:13.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--chip);color:var(--muted)}
.chip svg.i{width:14px;height:14px}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.green{background:var(--green-soft);color:var(--green)}
.progress{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--blue);border-radius:6px}
.task.done .progress i{background:var(--green)}
.pin-btn{color:var(--faint);padding:2px}
.pin-btn.on{color:var(--green)}
.pin-btn.on svg.i{fill:currentColor}
.pin-btn svg.i{width:20px;height:20px}

/* Notes */
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{text-align:left;border-radius:18px;padding:14px;border:1px solid var(--line);min-height:120px;display:flex;flex-direction:column;gap:6px;position:relative}
.note b{font-size:15px;font-weight:700;padding-right:18px}
.note p{margin:0;font-size:13.5px;color:var(--muted);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.note small{color:var(--faint);font-size:12px}
.note .pinmark{position:absolute;top:12px;right:12px;color:var(--green)}
.note .pinmark svg.i{width:15px;height:15px;fill:currentColor}
.c-yellow{background:var(--n-yellow)} .c-blue{background:var(--n-blue)} .c-green{background:var(--n-green)} .c-pink{background:var(--n-pink)} .c-purple{background:var(--n-purple)} .c-white{background:var(--n-white)}

.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 4px 14px}
.seg{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:14px;margin-bottom:16px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.group-label{font-size:13px;font-weight:700;color:var(--muted);margin:18px 6px 8px;text-transform:uppercase;letter-spacing:.6px}
.group-label.late{color:var(--red)}
.group-label:first-child{margin-top:0}

/* FAB & nav */
.fab{position:fixed;z-index:25;right:max(16px,calc(50% - 260px + 16px));bottom:calc(96px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(18,135,93,.35)}
.fab svg.i{width:30px;height:30px;stroke-width:2.2}
.fab:active{transform:scale(.95)}
.nav{position:fixed;z-index:24;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 14px;color:var(--faint);font-size:13px;font-weight:600}
.nav button.on{color:var(--green)}
.nav button.on svg.i{fill:currentColor;fill-opacity:.95}
.nav button.on[data-tab="todo"] svg.i,.nav button.on[data-tab="notes"] svg.i{fill:var(--green-soft)}

/* Overlays */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,15,13,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
.sheet.full{height:100%;max-height:none;border-radius:0;padding-top:calc(10px + env(safe-area-inset-top))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h3{flex:1;margin:0;font-size:19px;font-weight:700}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--item);outline:none;font-size:15px}
.input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
textarea.input{min-height:120px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--item);font-weight:600;font-size:14px}
.opt.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid var(--line)}
.swatch.on{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--item);margin-bottom:14px;width:100%;text-align:left}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on .sw{background:var(--green)} .toggle.on .sw::after{left:21px}
.btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;height:50px;border-radius:16px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{border:1px solid var(--line);background:var(--card)}
.btn.danger{color:var(--red);border:1px solid var(--red-line);background:var(--red-soft);flex:0 0 50px}
.btn svg.i{width:20px;height:20px}
.subs{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.sub-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--item)}
.sub-row .check{width:22px;height:22px}
.sub-row.done .check{background:var(--green);border-color:var(--green)}
.sub-row.done .check svg.i{opacity:1}
.sub-row input{flex:1;border:0;background:none;outline:none;min-width:0}
.sub-row.done input{text-decoration:line-through;color:var(--muted)}
.sub-row .x{color:var(--faint)}
.sub-row .x svg.i{width:18px;height:18px}
.add-sub{display:flex;gap:8px}
.add-sub .input{flex:1}
.add-sub button{width:48px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}

.chooser{display:grid;gap:10px}
.chooser button{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--item);text-align:left}
.chooser .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.chooser b{display:block;font-size:16px} .chooser small{color:var(--muted)}

.search-box{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--item);margin-bottom:16px}
.search-box input{flex:1;border:0;background:none;outline:none;padding:14px 0;font-size:16px}
.search-box svg.i{color:var(--muted)}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:17px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:12px;font-weight:700;color:var(--muted);padding:6px 0}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:14px;position:relative}
.day.out{color:var(--faint);opacity:.5}
.day.today{color:var(--green);background:var(--green-soft)}
.day.sel{background:var(--green);color:#fff}
.day .dots{display:flex;gap:3px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--green)}
.day .dots i.b{background:var(--blue)}
.day.sel .dots i{background:#fff}

.notif{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--item);text-align:left;width:100%}
.notif .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.notif .ic svg.i{width:20px;height:20px}
.notif b{display:block;font-size:15px} .notif small{color:var(--muted);font-size:13px}

.set-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--item);margin-bottom:10px;text-align:left;font-weight:600}
.set-row svg.i{color:var(--muted)}
.set-row.red{color:var(--red)} .set-row.red svg.i{color:var(--red)}
.about{color:var(--muted);font-size:13px;text-align:center;margin-top:16px}

.toast{position:fixed;z-index:80;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1d2622;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:#6ee7b7;font-weight:700}

@media (max-width:400px){
  .actions{gap:6px} .icon-btn{width:40px;height:40px} .logo{width:42px;height:42px} .brand b{font-size:18px}
  .hello{font-size:26px} .stat b{font-size:22px} .qa{font-size:14px;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo" aria-hidden="true"></div>
    <div class="brand"><b>KerjaKu</b><span class="status" id="status">Offline Ready</span></div>
    <div class="actions">
      <button class="icon-btn" data-act="search" aria-label="Cari"></button>
      <button class="icon-btn" data-act="calendar" aria-label="Kalender"></button>
      <button class="icon-btn" data-act="notif" aria-label="Notifikasi"><span class="dot" id="bell-dot"></span></button>
      <button class="icon-btn" data-act="settings" aria-label="Pengaturan"></button>
    </div>
  </header>
  <main id="view"></main>
</div>
<button class="fab" data-act="fab" aria-label="Tambah"></button>
<nav class="nav"><div class="nav-in">
  <button data-tab="home"><span data-ic="home"></span>Home</button>
  <button data-tab="todo"><span data-ic="checksq"></span>To Do</button>
  <button data-tab="tugas"><span data-ic="pin"></span>Tugas</button>
  <button data-tab="notes"><span data-ic="notes"></span>Notes</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* ---------- Ikon ---------- */
const P = {

/* ---------- Util ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 864e5);
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtLong = d => d.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fmtShort = s => parseD(s).toLocaleDateString('id-ID', {day:'numeric', month:'short'});
const fmtDay = s => parseD(s).toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'});
const PRIO = {tinggi:'Tinggi', sedang:'Sedang', rendah:'Rendah'};
const PRIO_RANK = {tinggi:0, sedang:1, rendah:2};
const COLORS = ['yellow','blue','green','pink','purple','white'];
const CATS = ['Kerja','Pribadi','Belanja','Kuliah','Lainnya'];
const isAndroid = typeof window.AndroidBridge !== 'undefined';

function load() {

  } catch (e) {}
  return seed();
}

/* ---------- Tema ---------- */

/* ---------- State tampilan ---------- */
let tab = 'home';
const view = { todoFilter:'aktif', taskFilter:'aktif' };
try { const t = sessionStorage.getItem('kerjaku.tab'); if (t) tab = t; } catch (e) {}

/* ---------- Komponen ---------- */
const sortTodos = arr => arr.slice().sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999') || (a.time||'99').localeCompare(b.time||'99') || PRIO_RANK[a.prio]-PRIO_RANK[b.prio]);
const sortTasks = arr => arr.slice().sort((a,b) => (a.done-b.done) || (b.pinned-a.pinned) || (a.date||'9999').localeCompare(b.date||'9999') || PRIO_RANK[a.prio]-PRIO_RANK[b.prio]);
const sortNotes = arr => arr.slice().sort((a,b) => (b.pinned-a.pinned) || b.updated.localeCompare(a.updated));
const isLateTodo = x => !x.done && x.date && (x.date < today() || (x.date === today() && x.time && x.time < nowHM()));

function todoItem(x, showDate) {
  const late = isLateTodo(x);
  const when = [];
  if (showDate && x.date && x.date !== today()) when.push(fmtShort(x.date));
  if (x.time) when.push(x.time);
  return `<div class="item ${x.done?'done':''}" data-act="edit-todo" data-id="${x.id}" role="button" tabindex="0">
    <button class="check" data-act="toggle-todo" data-id="${x.id}" aria-label="${x.done?'Tandai belum selesai':'Tandai selesai'}">${I('check')}</button>
    <div class="body"><div class="t">${esc(x.title)}</div>
      <div class="meta ${late?'late':''}">${when.length?`⏰ ${esc(when.join(' · '))}`:''}${when.length&&x.cat?'<span class="sep"></span>':''}${esc(x.cat||'')}${late?'<span class="sep"></span>Terlambat':''}</div></div>
    <span class="badge ${x.prio}">${PRIO[x.prio]}</span></div>`;
}
function dueChip(x) {
  if (!x.date) return '';
  if (x.done) return `<span class="chip green">${I('check')} Selesai</span>`;
  const d = diffDays(x.date, today());
  const label = d < 0 ? `Lewat ${-d} hari` : d === 0 ? 'Hari ini' : d === 1 ? 'Besok' : `${d} hari lagi`;
  const cls = d < 0 ? 'red' : d <= 1 ? 'red' : 'blue';
  return `<span class="chip ${cls}">${I('calendar')} ${fmtShort(x.date)} · ${label}</span>`;
}
function taskCard(x) {
  const total = x.subs.length, done = x.subs.filter(s=>s.done).length;
  const pct = x.done ? 100 : total ? Math.round(done/total*100) : 0;
  return `<div class="task ${x.done?'done':''}" data-act="edit-task" data-id="${x.id}" role="button" tabindex="0">
    <div class="task-top"><div class="t">${esc(x.title)}</div>
      <button class="pin-btn ${x.pinned?'on':''}" data-act="pin-task" data-id="${x.id}" aria-label="${x.pinned?'Lepas pin':'Pin'}">${I('pin')}</button></div>
    ${x.desc?`<div class="desc">${esc(x.desc)}</div>`:''}
    <div class="row">${dueChip(x)}<span class="badge ${x.prio}">${PRIO[x.prio]}</span>${total?`<span class="chip">${done}/${total} langkah</span>`:''}</div>
    ${total||x.done?`<div class="progress"><i style="width:${pct}%"></i></div>`:''}</div>`;
}
function noteCard(x) {
  return `<button class="note c-${x.color}" data-act="edit-note" data-id="${x.id}">
    ${x.pinned?`<span class="pinmark">${I('pin')}</span>`:''}
    <b>${esc(x.title||'Tanpa judul')}</b><p>${esc(x.body)}</p>
    <small>${new Date(x.updated).toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</small></button>`;
}
const empty = (title, sub) => `<div class="empty"><b>${title}</b>${sub}</div>`;

/* ---------- Halaman ---------- */
function greeting() {
  const h = new Date().getHours();
  if (h >= 4 && h < 11) return 'Good Morning ☀️';
  if (h < 15 && h >= 11) return 'Good Afternoon 🌤️';
  if (h < 18 && h >= 15) return 'Good Evening 🌇';
  return 'Good Night 🌙';
}
function renderHome() {
  const t = today();
  const focus = sortTodos(S.todos.filter(x => !x.done && x.date && x.date <= t));
  const pinned = sortTasks(S.tasks.filter(x => x.pinned && !x.done));
  const notes = sortNotes(S.notes).slice(0, 4);
  const doneCount = S.todos.filter(x=>x.done).length + S.tasks.filter(x=>x.done).length;
  const name = S.settings.name.trim();
  return `
  <section class="card">
    <div class="eyebrow">${esc(fmtLong(new Date()))}</div>
    <div class="hello">${greeting().replace(/ (\S+)$/, name?`, ${esc(name)} $1`:' $1')}</div>
    <div class="sub">Siap menyelesaikan target pekerjaanmu hari ini?</div>
    <div class="stats">
      <button class="stat s-todo" data-tab="todo"><b>${S.todos.filter(x=>!x.done).length}</b><span>To Do</span></button>
      <button class="stat s-task" data-tab="tugas"><b>${S.tasks.filter(x=>!x.done).length}</b><span>Tugas</span></button>
      <button class="stat s-note" data-tab="notes"><b>${S.notes.length}</b><span>Notes</span></button>
      <button class="stat done" data-act="show-done"><b>${doneCount}</b><span>Selesai</span></button>
    </div>
  </section>
  <div class="section-label">Quick Action</div>
  <div class="quick">
    <button class="qa s-todo" data-act="new-todo">${I('pluscircle')}To Do</button>
    <button class="qa s-task" data-act="new-task">${I('pluscircle')}Tugas</button>
    <button class="qa s-note" data-act="new-note">${I('pluscircle')}Notes</button>
  </div>
  <section class="card">
    <div class="card-head"><span class="live"></span><h2>Today's Focus</h2><span class="count">${focus.length} item</span></div>
    <div class="list">${focus.length ? focus.map(x=>todoItem(x, true)).join('') : empty('Semua beres 🎉','Tidak ada To Do untuk hari ini.')}</div>
  </section>
  <section class="card">
    <div class="card-head"><span class="pin">${I('pin')}</span><h2>Tugas Penting (Pinned)</h2><button class="link" data-tab="tugas">Lihat semua</button></div>
    <div class="list">${pinned.length ? pinned.map(taskCard).join('') : empty('Belum ada tugas yang di-pin','Tekan ikon pin pada tugas untuk menampilkannya di sini.')}</div>
  </section>
  <section class="card">
    <div class="card-head"><h2>Notes Terbaru</h2><button class="link" data-tab="notes">Lihat semua</button></div>
    ${notes.length ? `<div class="notes">${notes.map(noteCard).join('')}</div>` : empty('Belum ada catatan','Tulis ide atau catatan rapat di sini.')}
  </section>`;
}
function renderTodo() {
  const f = view.todoFilter, t = today();
  let items = S.todos.filter(x => f === 'selesai' ? x.done : f === 'hari' ? !x.done && x.date && x.date <= t : !x.done);
  items = sortTodos(items);
  const groups = {};
  for (const x of items) {
    let g;
    if (f === 'selesai') g = 'Selesai';
    else if (!x.date) g = 'Tanpa tanggal';
    else if (x.date < t) g = 'Terlambat';
    else if (x.date === t) g = 'Hari ini';
    else if (x.date === addDays(t,1)) g = 'Besok';
    else g = fmtDay(x.date);
    (groups[g] ||= []).push(x);
  }
  const body = items.length
    ? Object.entries(groups).map(([g, arr]) => `<div class="group-label ${g==='Terlambat'?'late':''}">${esc(g)} · ${arr.length}</div><div class="list">${arr.map(x=>todoItem(x, f==='selesai')).join('')}</div>`).join('')
    : `<div class="card">${empty(f==='selesai'?'Belum ada yang selesai':'Tidak ada To Do', f==='selesai'?'Centang To Do untuk menandainya selesai.':'Tekan tombol + untuk menambah To Do.')}</div>`;
  return `<h1 class="page-title">To Do</h1>
  <div class="seg">${[['hari','Hari ini'],['aktif','Semua aktif'],['selesai','Selesai']].map(([k,l])=>`<button class="${f===k?'on':''}" data-act="todo-filter" data-v="${k}">${l}</button>`).join('')}</div>
  ${body}`;
}
function renderTugas() {
  const f = view.taskFilter;
  const items = sortTasks(S.tasks.filter(x => f === 'semua' ? true : f === 'selesai' ? x.done : !x.done));
  return `<h1 class="page-title">Tugas</h1>
  <div class="seg">${[['aktif','Aktif'],['semua','Semua'],['selesai','Selesai']].map(([k,l])=>`<button class="${f===k?'on':''}" data-act="task-filter" data-v="${k}">${l}</button>`).join('')}</div>
  ${items.length ? `<div class="list">${items.map(taskCard).join('')}</div>` : `<div class="card">${empty('Belum ada tugas','Tugas cocok untuk pekerjaan dengan deadline dan beberapa langkah.')}</div>`}`;
}
function renderNotes() {
  const items = sortNotes(S.notes);
  return `<h1 class="page-title">Notes</h1>
  ${items.length ? `<div class="notes">${items.map(noteCard).join('')}</div>` : `<div class="card">${empty('Belum ada catatan','Tekan tombol + untuk menulis catatan.')}</div>`}`;
}
function render() {
  const v = $('#view');
  v.innerHTML = tab === 'todo' ? renderTodo() : tab === 'tugas' ? renderTugas() : tab === 'notes' ? renderNotes() : renderHome();
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#bell-dot').classList.toggle('on', notifSignature() !== '' && notifSignature() !== S.settings.seenNotif);
}
function setTab(t) {
  tab = t;
  try { sessionStorage.setItem('kerjaku.tab', t); } catch (e) {}
  render();
  window.scrollTo(0, 0);
}

/* ---------- Overlay (sheet) ---------- */
const stack = [];
let replaceNext = false;
function openSheet(html, {full=false, onMount}={}) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet ${full?'full':''}" role="dialog" aria-modal="true">${full?'':'<div class="grab"></div>'}${html}</div>`;
  scrim.addEventListener('click', e => { if (e.target === scrim) closeTop(); });
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  if (replaceNext && stack.length) { stack.pop().remove(); stack.push(scrim); history.replaceState({sheet: stack.length}, ''); }
  else { stack.push(scrim); history.pushState({sheet: stack.length}, ''); }
  replaceNext = false;
  onMount && onMount(scrim.firstElementChild);
  return scrim.firstElementChild;
}
function removeTop() {
  const el = stack.pop();
  if (el) el.remove();
  if (!stack.length) document.body.style.overflow = '';
}
function closeTop() { if (stack.length) history.back(); }
window.addEventListener('popstate', e => { const want = (e.state && e.state.sheet) || 0; while (stack.length > want) removeTop(); });
function closeAll() { const n = stack.length; if (n) history.go(-n); }
const head = title => `<div class="sheet-head"><h3>${title}</h3><button class="icon-btn" data-act="close" aria-label="Tutup">${I('x')}</button></div>`;

/* ---------- Form ---------- */
function prioPicker(cur) {
  return `<div class="field"><span>Prioritas</span><div class="opts" data-group="prio">${Object.entries(PRIO).map(([k,l])=>`<button type="button" class="opt ${cur===k?'on':''}" data-v="${k}">${l}</button>`).join('')}</div></div>`;
}
function bindOpts(root) {
  root.querySelectorAll('[data-group]').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    g.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b));
  }));
  root.querySelectorAll('.toggle').forEach(t => t.addEventListener('click', () => t.classList.toggle('on')));
}
const groupVal = (root, name) => root.querySelector(`[data-group="${name}"] .on`)?.dataset.v;

function todoForm(id, preset={}) {
  const x = S.todos.find(t => t.id === id) || Object.assign({title:'', date:today(), time:'', cat:'Kerja', prio:'sedang', done:false}, preset);
  const cats = [...new Set([...CATS, ...S.todos.map(t=>t.cat).filter(Boolean)])];
  openSheet(`${head(id?'Edit To Do':'To Do Baru')}
    <form id="f">
      <label class="field"><span>Judul</span><input class="input" name="title" required maxlength="120" value="${esc(x.title)}" placeholder="Mis. Kirim dokumen"></label>
      <div class="row2">
        <label class="field"><span>Tanggal</span><input class="input" type="date" name="date" value="${esc(x.date)}"></label>
        <label class="field"><span>Jam</span><input class="input" type="time" name="time" value="${esc(x.time)}"></label>
      </div>
      <label class="field"><span>Kategori</span><input class="input" name="cat" list="cats" value="${esc(x.cat)}" maxlength="30"><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
      ${prioPicker(x.prio)}
      <div class="btns">${id?`<button type="button" class="btn danger" data-act="del-todo" data-id="${id}" aria-label="Hapus">${I('trash')}</button>`:''}<button class="btn primary">${I('check')}Simpan</button></div>
    </form>`, {onMount: root => {
      bindOpts(root);
      const f = root.querySelector('#f');
      if (!id) setTimeout(() => f.title.focus(), 150);
      f.addEventListener('submit', e => {
        e.preventDefault();
        const data = {title:f.title.value.trim(), date:f.date.value, time:f.time.value, cat:f.cat.value.trim(), prio:groupVal(root,'prio')||'sedang'};
        if (!data.title) return f.title.focus();
        if (id) Object.assign(x, data); else S.todos.push(Object.assign({id:uid(), done:false, created:new Date().toISOString()}, data));
        commit(id ? 'To Do diperbarui' : 'To Do ditambahkan'); closeTop();
      });
    }});
}
function taskForm(id) {
  const x = S.tasks.find(t => t.id === id) || {title:'', desc:'', date:addDays(today(),1), time:'', prio:'sedang', pinned:false, done:false, subs:[]};
  let subs = x.subs.map(s => ({...s}));
  const subsHtml = () => subs.map(s => `<div class="sub-row ${s.done?'done':''}" data-sid="${s.id}">
      <button type="button" class="check" data-sub="toggle">${I('check')}</button>
      <input value="${esc(s.t)}" data-sub="text" maxlength="100" aria-label="Langkah">
      <button type="button" class="x" data-sub="del" aria-label="Hapus langkah">${I('x')}</button></div>`).join('');
  openSheet(`${head(id?'Edit Tugas':'Tugas Baru')}
    <form id="f">
      <label class="field"><span>Judul</span><input class="input" name="title" required maxlength="120" value="${esc(x.title)}" placeholder="Mis. Rekap penjualan bulanan"></label>
      <label class="field"><span>Deskripsi</span><textarea class="input" name="desc" style="min-height:80px" maxlength="1000" placeholder="Opsional">${esc(x.desc)}</textarea></label>
      <div class="row2">
        <label class="field"><span>Deadline</span><input class="input" type="date" name="date" value="${esc(x.date)}"></label>
        <label class="field"><span>Jam</span><input class="input" type="time" name="time" value="${esc(x.time)}"></label>
      </div>
      ${prioPicker(x.prio)}
      <div class="field"><span>Langkah-langkah</span><div class="subs" id="subs">${subsHtml()}</div>
        <div class="add-sub"><input class="input" id="sub-new" placeholder="Tambah langkah…" maxlength="100"><button type="button" id="sub-add" aria-label="Tambah langkah">${I('plus')}</button></div></div>
      <button type="button" class="toggle ${x.pinned?'on':''}" data-t="pinned"><span>📌 Pin ke Home (Tugas Penting)</span><span class="sw"></span></button>
      ${id?`<button type="button" class="toggle ${x.done?'on':''}" data-t="done"><span>✅ Tandai tugas selesai</span><span class="sw"></span></button>`:''}
      <div class="btns">${id?`<button type="button" class="btn danger" data-act="del-task" data-id="${id}" aria-label="Hapus">${I('trash')}</button>`:''}<button class="btn primary">${I('check')}Simpan</button></div>
    </form>`, {onMount: root => {
      bindOpts(root);
      const f = root.querySelector('#f'), box = root.querySelector('#subs'), inp = root.querySelector('#sub-new');
      const addSub = () => { const v = inp.value.trim(); if (!v) return; subs.push({id:uid(), t:v, done:false}); box.innerHTML = subsHtml(); inp.value = ''; inp.focus(); };
      root.querySelector('#sub-add').addEventListener('click', addSub);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addSub(); } });
      box.addEventListener('click', e => {
        const b = e.target.closest('[data-sub]'); if (!b || b.dataset.sub === 'text') return;
        const s = subs.find(s => s.id === b.closest('[data-sid]').dataset.sid);
        if (b.dataset.sub === 'toggle') s.done = !s.done; else subs = subs.filter(z => z !== s);
        box.innerHTML = subsHtml();
      });
      box.addEventListener('input', e => { if (e.target.dataset.sub === 'text') subs.find(s => s.id === e.target.closest('[data-sid]').dataset.sid).t = e.target.value; });
      if (!id) setTimeout(() => f.title.focus(), 150);
      f.addEventListener('submit', e => {
        e.preventDefault();
        if (inp.value.trim()) addSub();
        const data = {title:f.title.value.trim(), desc:f.desc.value.trim(), date:f.date.value, time:f.time.value, prio:groupVal(root,'prio')||'sedang',
          pinned:root.querySelector('[data-t="pinned"]').classList.contains('on'),
          done:id ? root.querySelector('[data-t="done"]').classList.contains('on') : false,
          subs:subs.filter(s => s.t.trim())};
        if (!data.title) return f.title.focus();
        if (id) Object.assign(x, data); else S.tasks.push(Object.assign({id:uid(), created:new Date().toISOString()}, data));
        commit(id ? 'Tugas diperbarui' : 'Tugas ditambahkan'); closeTop();
      });
    }});
}
function noteForm(id) {
  const x = S.notes.find(t => t.id === id) || {title:'', body:'', color:'yellow', pinned:false};
  openSheet(`${head(id?'Edit Catatan':'Catatan Baru')}
    <form id="f">
      <label class="field"><span>Judul</span><input class="input" name="title" maxlength="120" value="${esc(x.title)}" placeholder="Judul catatan"></label>
      <label class="field"><span>Isi</span><textarea class="input" name="body" style="min-height:180px" placeholder="Tulis sesuatu…">${esc(x.body)}</textarea></label>
      <div class="field"><span>Warna</span><div class="opts" data-group="color">${COLORS.map(c=>`<button type="button" class="swatch c-${c} ${x.color===c?'on':''}" data-v="${c}" aria-label="${c}"></button>`).join('')}</div></div>
      <button type="button" class="toggle ${x.pinned?'on':''}" data-t="pinned"><span>📌 Sematkan di atas</span><span class="sw"></span></button>
      <div class="btns">${id?`<button type="button" class="btn danger" data-act="del-note" data-id="${id}" aria-label="Hapus">${I('trash')}</button>`:''}<button class="btn primary">${I('check')}Simpan</button></div>
    </form>`, {onMount: root => {
      bindOpts(root);
      const f = root.querySelector('#f');
      if (!id) setTimeout(() => f.title.focus(), 150);
      f.addEventListener('submit', e => {
        e.preventDefault();
        const data = {title:f.title.value.trim(), body:f.body.value, color:groupVal(root,'color')||'yellow', pinned:root.querySelector('[data-t="pinned"]').classList.contains('on'), updated:new Date().toISOString()};
        if (!data.title && !data.body.trim()) return f.title.focus();
        if (id) Object.assign(x, data); else S.notes.push(Object.assign({id:uid()}, data));
        commit(id ? 'Catatan diperbarui' : 'Catatan disimpan'); closeTop();
      });
    }});
}
function chooser() {
  openSheet(`${head('Tambah baru')}<div class="chooser">
    <button data-act="new-todo"><span class="ic" style="background:var(--green-soft);color:var(--green)">${I('checksq')}</span><span><b>To Do</b><small>Pekerjaan singkat dengan jam</small></span></button>
    <button data-act="new-task"><span class="ic" style="background:var(--blue-soft);color:var(--blue)">${I('pin')}</span><span><b>Tugas</b><small>Pekerjaan dengan deadline & langkah</small></span></button>
    <button data-act="new-note"><span class="ic" style="background:var(--orange-soft);color:var(--orange)">${I('notes')}</span><span><b>Notes</b><small>Catatan bebas & ide</small></span></button>
  </div>`);
}

/* ---------- Hapus + urungkan ---------- */
function removeItem(kind, id) {
  const arr = S[kind], idx = arr.findIndex(x => x.id === id);
  if (idx < 0) return;
  const [item] = arr.splice(idx, 1);
  commit();
  closeTop();
  toast('Item dihapus', 'Urungkan', () => { arr.splice(idx, 0, item); commit('Dipulihkan'); });
}

/* ---------- Cari ---------- */
function searchSheet() {
  openSheet(`${head('Cari')}<div class="search-box">${I('search')}<input id="q" placeholder="Cari To Do, Tugas, Notes…" autocomplete="off"></div><div id="res"></div>`, {full:true, onMount: root => {
    const q = root.querySelector('#q'), res = root.querySelector('#res');
    const run = () => {
      const s = q.value.trim().toLowerCase();
      if (!s) { res.innerHTML = empty('Ketik untuk mencari', 'Pencarian mencakup judul, kategori, deskripsi, dan isi catatan.'); return; }
      const has = (...f) => f.some(v => String(v||'').toLowerCase().includes(s));
      const td = sortTodos(S.todos.filter(x => has(x.title, x.cat)));
      const tk = sortTasks(S.tasks.filter(x => has(x.title, x.desc, ...x.subs.map(z=>z.t))));
      const nt = sortNotes(S.notes.filter(x => has(x.title, x.body)));
      res.innerHTML = (td.length||tk.length||nt.length)
        ? (td.length?`<div class="group-label">To Do · ${td.length}</div><div class="list">${td.map(x=>todoItem(x,true)).join('')}</div>`:'')
          + (tk.length?`<div class="group-label">Tugas · ${tk.length}</div><div class="list">${tk.map(taskCard).join('')}</div>`:'')
          + (nt.length?`<div class="group-label">Notes · ${nt.length}</div><div class="notes">${nt.map(noteCard).join('')}</div>`:'')
        : empty('Tidak ditemukan', `Tidak ada hasil untuk “${esc(q.value)}”.`);
    };
    q.addEventListener('input', run); run();
    setTimeout(() => q.focus(), 150);
    root._refresh = run;
  }});
}

/* ---------- Kalender ---------- */
function calendarSheet() {
  let cur = new Date(); cur.setDate(1);
  let sel = today();
  openSheet(`${head('Kalender')}<div id="cal"></div><div id="cal-list"></div>`, {full:true, onMount: root => {
    const draw = () => {
      const y = cur.getFullYear(), m = cur.getMonth();
      const start = new Date(y, m, 1); const off = (start.getDay() + 6) % 7; // Senin pertama
      const first = new Date(y, m, 1 - off);
      let cells = '';
      for (let i = 0; i < 42; i++) {
        const d = new Date(first); d.setDate(first.getDate() + i);
        const s = ymd(d);
        const hasT = S.todos.some(x => x.date === s && !x.done), hasK = S.tasks.some(x => x.date === s && !x.done);
        cells += `<button class="day ${d.getMonth()!==m?'out':''} ${s===today()?'today':''} ${s===sel?'sel':''}" data-day="${s}">${d.getDate()}<span class="dots">${hasT?'<i></i>':''}${hasK?'<i class="b"></i>':''}</span></button>`;
      }
      root.querySelector('#cal').innerHTML = `<div class="card" style="padding:16px">
        <div class="cal-head"><button class="icon-btn" data-nav="-1" aria-label="Bulan sebelumnya">${I('chevL')}</button><b>${start.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><button class="icon-btn" data-nav="1" aria-label="Bulan berikutnya">${I('chevR')}</button></div>
        <div class="cal-grid">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></div>`;
      const td = sortTodos(S.todos.filter(x => x.date === sel)), tk = sortTasks(S.tasks.filter(x => x.date === sel));
      root.querySelector('#cal-list').innerHTML = `<div class="card-head"><h2 style="font-size:17px">${esc(fmtDay(sel))}</h2><button class="link" data-act="new-todo" data-date="${sel}">+ To Do</button></div>
        ${td.length||tk.length ? `${td.length?`<div class="list">${td.map(x=>todoItem(x,false)).join('')}</div>`:''}${tk.length?`<div class="group-label">Deadline tugas</div><div class="list">${tk.map(taskCard).join('')}</div>`:''}` : empty('Kosong','Tidak ada To Do atau deadline di tanggal ini.')}`;
    };
    root.addEventListener('click', e => {
      const n = e.target.closest('[data-nav]'); if (n) { cur.setMonth(cur.getMonth() + Number(n.dataset.nav)); draw(); }
      const d = e.target.closest('[data-day]'); if (d) { sel = d.dataset.day; const dd = parseD(sel); if (dd.getMonth() !== cur.getMonth()) { cur = new Date(dd.getFullYear(), dd.getMonth(), 1); } draw(); }
    });
    draw();
    root._refresh = draw;
  }});
}

/* ---------- Notifikasi ---------- */
function notifications() {
  const t = today(), now = nowHM(), out = [];
  for (const x of S.todos) {
    if (x.done || !x.date) continue;
    if (isLateTodo(x)) out.push({kind:'late', id:x.id, type:'todo', title:x.title, sub:`Terlambat · ${x.date===t?'hari ini '+x.time:fmtShort(x.date)+(x.time?' '+x.time:'')}`});
    else if (x.date === t) out.push({kind:'soon', id:x.id, type:'todo', title:x.title, sub:`Hari ini${x.time?' pukul '+x.time:''}`});
  }
  for (const x of S.tasks) {
    if (x.done || !x.date) continue;
    const d = diffDays(x.date, t);
    if (d < 0) out.push({kind:'late', id:x.id, type:'task', title:x.title, sub:`Deadline lewat ${-d} hari`});
    else if (d <= 2) out.push({kind:'task', id:x.id, type:'task', title:x.title, sub:`Deadline ${d===0?'hari ini':d===1?'besok':'2 hari lagi'}`});
  }
  return out;
}
const notifSignature = () => notifications().map(n => n.kind + n.id).join('|');
function notifSheet() {
  const list = notifications();
  S.settings.seenNotif = notifSignature(); save(); render();
  const style = {late:['var(--red-soft)','var(--red)','alert'], soon:['var(--green-soft)','var(--green)','clock'], task:['var(--blue-soft)','var(--blue)','calendar']};
  openSheet(`${head('Notifikasi')}<div class="list">${list.length ? list.map(n => {
      const [bg, fg, ic] = style[n.kind];
      return `<button class="notif" data-act="edit-${n.type}" data-id="${n.id}"><span class="ic" style="background:${bg};color:${fg}">${I(ic)}</span><span><b>${esc(n.title)}</b><small>${esc(n.sub)}</small></span></button>`;
    }).join('') : empty('Tidak ada pemberitahuan','Pengingat To Do hari ini dan deadline tugas akan muncul di sini.')}</div>`);
}
function sysNotify(title, body) {
  if (isAndroid) { try { window.AndroidBridge.notify(title, body); } catch (e) {} return; }
  if ('Notification' in window && Notification.permission === 'granted') {
    navigator.serviceWorker?.getRegistration().then(r => r ? r.showNotification(title, {body, icon:'icon-192.png', badge:'icon-192.png'}) : new Notification(title, {body}))
      .catch(() => { try { new Notification(title, {body}); } catch (e) {} });
  }
}
function checkReminders() {
  if (!S.settings.remind) return;
  const t = today(), now = nowHM();
  let changed = false;
  for (const x of S.todos) {
    if (x.done || x.date !== t || !x.time || x.time > now) continue;
    const key = x.id + '@' + x.date + x.time;
    if (S.fired[key]) continue;
    S.fired[key] = 1; changed = true;
    sysNotify('⏰ ' + x.title, `Waktunya sekarang (${x.time}) · ${x.cat || 'To Do'}`);
  }
  // bersihkan catatan lama
  for (const k of Object.keys(S.fired)) if (k.split('@')[1]?.slice(0,10) < addDays(t,-7)) { delete S.fired[k]; changed = true; }
  if (changed) save();
}

/* ---------- Pengaturan ---------- */
function settingsSheet() {
  const s = S.settings;
  openSheet(`${head('Pengaturan')}
    <label class="field"><span>Nama panggilan (untuk sapaan)</span><input class="input" id="name" maxlength="30" value="${esc(s.name)}" placeholder="Opsional"></label>
    <div class="field"><span>Tema</span><div class="opts" data-group="theme">${[['system','Ikuti sistem'],['light','Terang'],['dark','Gelap']].map(([k,l])=>`<button type="button" class="opt ${s.theme===k?'on':''}" data-v="${k}">${l}</button>`).join('')}</div></div>
    <button type="button" class="toggle ${s.remind?'on':''}" id="remind"><span>🔔 Pengingat To Do sesuai jam<br><small style="color:var(--muted);font-weight:400">Muncul saat aplikasi sedang terbuka</small></span><span class="sw"></span></button>
    <div class="field"><span>Data</span></div>
    <button class="set-row" data-act="export">${I('download')}Ekspor cadangan (JSON)</button>
    <button class="set-row" data-act="import">${I('upload')}Impor dari cadangan</button>
    <button class="set-row red" data-act="reset">${I('trash')}Hapus semua data</button>
    <div class="about">KerjaKu v1.0 · Data tersimpan di perangkat ini dan berjalan tanpa internet.</div>`, {onMount: root => {
      bindOpts(root);
      root.querySelector('#name').addEventListener('input', e => { s.name = e.target.value; save(); render(); });
      root.querySelector('[data-group="theme"]').addEventListener('click', () => { s.theme = groupVal(root,'theme'); save(); applyTheme(); });
      root.querySelector('#remind').addEventListener('click', async e => {
        const on = e.currentTarget.classList.contains('on');
        s.remind = on;
        if (on && !isAndroid && 'Notification' in window && Notification.permission === 'default') {
          const p = await Notification.requestPermission();
          if (p !== 'granted') toast('Izin notifikasi ditolak; pengingat hanya tampil di dalam aplikasi');
        }
        if (on && isAndroid) { try { window.AndroidBridge.requestNotifyPermission(); } catch (err) {} }
        save(); checkReminders();
      });
    }});
}
function exportData() {
  const data = JSON.stringify({app:'KerjaKu', version:1, exported:new Date().toISOString(), todos:S.todos, tasks:S.tasks, notes:S.notes}, null, 2);
  const name = `kerjaku-cadangan-${today()}.json`;
  if (isAndroid) { try { window.AndroidBridge.saveFile(name, data); return; } catch (e) {} }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Cadangan diunduh');
}
$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.todos) || !Array.isArray(d.tasks) || !Array.isArray(d.notes)) throw 0;
    if (!confirm(`Ganti data sekarang dengan cadangan ini?\n${d.todos.length} To Do, ${d.tasks.length} Tugas, ${d.notes.length} Notes.`)) return;
    S.todos = d.todos; S.tasks = d.tasks.map(t => ({subs:[], ...t})); S.notes = d.notes;
    commit('Data berhasil dipulihkan'); closeAll();
  } catch (err) { toast('Berkas cadangan tidak valid'); }
});

/* ---------- Simpan + render ---------- */
function commit(msg) {
  save(); render();
  stack.forEach(s => s.firstElementChild._refresh && s.firstElementChild._refresh());
  if (msg) toast(msg);
}
let toastTimer;
function toast(msg, actLabel, act) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actLabel?`<button>${esc(actLabel)}</button>`:''}`;
  if (act) t.querySelector('button').onclick = () => { t.classList.remove('show'); act(); };
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), actLabel ? 5000 : 2200);
}

/* ---------- Event ---------- */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn && !e.target.closest('.sheet')) { setTab(tabBtn.dataset.tab); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id, act = el.dataset.act;
  switch (act) {
    case 'toggle-todo': {
      e.stopPropagation();
      const x = S.todos.find(t => t.id === id); x.done = !x.done;
      commit(x.done ? 'Mantap, satu selesai ✓' : null); break;
    }
    case 'pin-task': {
      e.stopPropagation();
      const x = S.tasks.find(t => t.id === id); x.pinned = !x.pinned;
      commit(x.pinned ? 'Disematkan ke Home' : 'Pin dilepas'); break;
    }
    case 'edit-todo': todoForm(id); break;
    case 'edit-task': taskForm(id); break;
    case 'edit-note': noteForm(id); break;
    case 'new-todo': replaceNext = !!el.closest('.chooser'); todoForm(null, el.dataset.date ? {date:el.dataset.date} : {}); break;
    case 'new-task': replaceNext = !!el.closest('.chooser'); taskForm(null); break;
    case 'new-note': replaceNext = !!el.closest('.chooser'); noteForm(null); break;
    case 'fab': tab === 'todo' ? todoForm(null) : tab === 'tugas' ? taskForm(null) : tab === 'notes' ? noteForm(null) : chooser(); break;
    case 'del-todo': removeItem('todos', id); break;
    case 'del-task': removeItem('tasks', id); break;
    case 'del-note': removeItem('notes', id); break;
    case 'todo-filter': view.todoFilter = el.dataset.v; render(); break;
    case 'task-filter': view.taskFilter = el.dataset.v; render(); break;
    case 'show-done': view.todoFilter = 'selesai'; setTab('todo'); break;
    case 'close': closeTop(); break;
    case 'search': searchSheet(); break;
    case 'calendar': calendarSheet(); break;
    case 'notif': notifSheet(); break;
    case 'settings': settingsSheet(); break;
    case 'export': exportData(); break;
    case 'import': $('#import-file').click(); break;
    case 'reset':
      if (confirm('Hapus semua To Do, Tugas, dan Notes? Tindakan ini tidak bisa dibatalkan.')) {
        S.todos = []; S.tasks = []; S.notes = []; S.fired = {}; commit('Semua data dihapus'); closeAll();
      }
      break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && stack.length) closeTop();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.item[role=button],.task[role=button]') ) { e.preventDefault(); e.target.click(); }
});

/* Dipanggil tombol Back Android: true = sudah ditangani */
window.KerjaKu = {
  back() {
    if (stack.length) { closeTop(); return true; }
    if (tab !== 'home') { setTab('home'); return true; }
    return false;
  },
  importJson(text) {
    try {
      const d = JSON.parse(text);
      if (!Array.isArray(d.todos) || !Array.isArray(d.tasks) || !Array.isArray(d.notes)) throw 0;
      S.todos = d.todos; S.tasks = d.tasks.map(t => ({subs:[], ...t})); S.notes = d.notes;
      commit('Data berhasil dipulihkan'); closeAll();
    } catch (e) { toast('Berkas cadangan tidak valid'); }
  },
  toast,
};

/* ---------- Status online/offline ---------- */
function updateStatus() {
  const s = $('#status');
  const on = navigator.onLine;
  s.textContent = on ? 'Offline Ready' : 'Mode Offline';
  s.classList.toggle('off', !on);
}
window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);

/* ---------- Isi ikon & mulai ---------- */
document.querySelector('.logo').innerHTML = I('leaf');
document.querySelector('[data-act="search"]').insertAdjacentHTML('afterbegin', I('search'));
document.querySelector('[data-act="calendar"]').insertAdjacentHTML('afterbegin', I('calendar'));
document.querySelector('[data-act="notif"]').insertAdjacentHTML('afterbegin', I('bell'));
document.querySelector('[data-act="settings"]').insertAdjacentHTML('afterbegin', I('gear'));
document.querySelector('.fab').innerHTML = I('plus');
document.querySelectorAll('[data-ic]').forEach(s => s.outerHTML = I(s.dataset.ic));

updateStatus();
render();
checkReminders();
setInterval(() => { checkReminders(); if (!stack.length) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); checkReminders(); } });
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });

if ('serviceWorker' in navigator && !isAndroid && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
