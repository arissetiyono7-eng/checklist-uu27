<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="theme-color">
<meta name="description" content="KerjaKu — To Do, Tugas, dan Notes bergaya Notion yang tetap jalan tanpa internet.">
<title>KerjaKu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
/* =====================================================================
   SISTEM WARNA (color theory)
   - 60-30-10: 60% netral hangat (latar & teks, hue ±45°), 30% permukaan
     abu-abu lembut (blok, tag, hover), 10% aksen biru untuk interaksi.
   - Skema split-complementary untuk tiga jenis konten:
       To Do  = biru   (sejuk, "aksi"; satu keluarga dengan aksen)
       Tugas  = ungu   (analog dengan biru → masih "kerja")
       Notes  = oranye (komplementer biru/ungu → hangat, "ide")
   - Warna semantik konsisten: merah = Tinggi/terlambat, kuning = Sedang,
     abu-abu = Rendah (diredam agar tidak bersaing), hijau = selesai.
   - Palet 9 warna mengikuti Notion: setiap warna punya 3 varian
     (teks, latar blok, tag) untuk mode terang & gelap.
   ===================================================================== */
const PALETTE = {
  light: {
    base: { bg:'#ffffff', bg2:'#f7f7f5', hover:'rgba(55,53,47,.06)', press:'rgba(55,53,47,.10)',
            text:'#37352f', text2:'#73726e', text3:'#a5a49f', line:'#e9e9e7', line2:'#dcdcd9',
            accent:'#2383e2', accentSoft:'rgba(35,131,226,.12)',
            today:'#eb5757', shadow:'rgba(15,15,15,.05) 0 0 0 1px, rgba(15,15,15,.08) 0 3px 6px, rgba(15,15,15,.14) 0 9px 24px',
            scrim:'rgba(15,15,15,.4)', coverFilter:'none' },
    tx:  { gray:'#787774', brown:'#9f6b53', orange:'#d9730d', yellow:'#cb912f', green:'#448361', blue:'#337ea9', purple:'#9065b0', pink:'#c14c8a', red:'#d44c47' },
    bgc: { gray:'#f1f1ef', brown:'#f4eeee', orange:'#fbecdd', yellow:'#fbf3db', green:'#edf3ec', blue:'#e7f3f8', purple:'#f6f3f9', pink:'#faf1f5', red:'#fdebec', default:'#f7f7f5' },
    tagB:{ default:'rgba(227,226,224,.5)', gray:'#e3e2e0', brown:'#eee0da', orange:'#fadec9', yellow:'#fdecc8', green:'#dbeddb', blue:'#d3e5ef', purple:'#e8deee', pink:'#f5e0e9', red:'#ffe2dd' },
    tagF:{ default:'#32302c', gray:'#32302c', brown:'#442a1e', orange:'#49290e', yellow:'#402c1b', green:'#1c3829', blue:'#183347', purple:'#412454', pink:'#4c2337', red:'#5d1715' },
  },
  dark: {
    base: { bg:'#191919', bg2:'#202020', hover:'rgba(255,255,255,.055)', press:'rgba(255,255,255,.09)',
            text:'#d4d4d4', text2:'#9b9b9b', text3:'#6b6b6b', line:'#2f2f2f', line2:'#3a3a3a',
            accent:'#2383e2', accentSoft:'rgba(35,131,226,.22)',
            today:'#eb5757', shadow:'rgba(0,0,0,.3) 0 0 0 1px, rgba(0,0,0,.35) 0 3px 6px, rgba(0,0,0,.45) 0 9px 24px',
            scrim:'rgba(0,0,0,.6)', coverFilter:'brightness(.72) saturate(.9)' },
    tx:  { gray:'#9b9b9b', brown:'#ba856f', orange:'#c77d48', yellow:'#ca9849', green:'#529e72', blue:'#379ad3', purple:'#9d68d3', pink:'#d15796', red:'#e65b58' },
    bgc: { gray:'#2f2f2f', brown:'#4a3228', orange:'#5c3b23', yellow:'#564328', green:'#243d30', blue:'#143a4e', purple:'#3c2d49', pink:'#4e2c3c', red:'#522e2a', default:'#252525' },
    tagB:{ default:'#373737', gray:'#5a5a5a', brown:'#603b2c', orange:'#854c1d', yellow:'#89632a', green:'#2b593f', blue:'#28456c', purple:'#492f64', pink:'#69314c', red:'#6e3630' },
    tagF:{ default:'#e6e6e6', gray:'#e6e6e6', brown:'#e6e6e6', orange:'#e6e6e6', yellow:'#e6e6e6', green:'#e6e6e6', blue:'#e6e6e6', purple:'#e6e6e6', pink:'#e6e6e6', red:'#e6e6e6' },
  },
};
(function injectTokens(){
  const kebab = s => s.replace(/[A-Z]/g, m => '-' + m.toLowerCase());
  const vars = p => {
    let out = Object.entries(p.base).map(([k,v]) => `--${kebab(k)}:${v};`).join('');
    for (const [k,v] of Object.entries(p.tx))   out += `--tx-${k}:${v};`;
    for (const [k,v] of Object.entries(p.bgc))  out += `--bg-${k}:${v};`;
    for (const [k,v] of Object.entries(p.tagB)) out += `--tag-${k}-b:${v};`;
    for (const [k,v] of Object.entries(p.tagF)) out += `--tag-${k}-f:${v};`;
    return out;
  };
  let css = `:root{${vars(PALETTE.light)}color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${vars(PALETTE.dark)}color-scheme:dark}}
:root[data-theme="dark"]{${vars(PALETTE.dark)}color-scheme:dark}`;
  for (const n of Object.keys(PALETTE.light.tagB)) css += `.tag.c-${n}{background:var(--tag-${n}-b);color:var(--tag-${n}-f)}.bg-${n}{background:var(--bg-${n})}`;
  for (const n of Object.keys(PALETTE.light.tx)) css += `.tx-${n}{color:var(--tx-${n})}.dot-${n}{background:var(--tx-${n})}`;
  const s = document.createElement('style'); s.id = 'tokens'; s.textContent = css; document.head.appendChild(s);
})();
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Roboto,Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji","Segoe UI Symbol";font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:680px;margin:0 auto}

/* ---------- Top bar (breadcrumb ala Notion) ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;gap:2px;height:48px;padding:0 8px 0 12px}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1;font-size:14px}
.crumb .ws{display:flex;align-items:center;gap:7px;padding:4px 4px;border-radius:4px;font-weight:600;white-space:nowrap}
.mark{width:22px;height:22px;border-radius:5px;background:var(--tag-green-b);color:var(--tx-green);display:grid;place-items:center;flex:none}
.mark svg.i{width:15px;height:15px;stroke-width:2.1}
.crumb .sep{color:var(--text3)}
.crumb .cur{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;color:var(--text2);position:relative;flex:none}
.ib:hover,.ib:active{background:var(--hover)}
.ib .badge-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--today);display:none}
.ib .badge-dot.on{display:block}

/* ---------- Tata letak halaman ---------- */
main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.cover{height:120px;position:relative;overflow:hidden}
.cover i{position:absolute;inset:0;filter:var(--cover-filter)}
.page{padding:0 20px}
.page-icon{font-size:56px;line-height:1;margin:-34px 0 6px;position:relative;z-index:1;width:max-content}
.page-icon.solo{margin-top:22px;font-size:44px}
h1.title{font-size:32px;font-weight:700;letter-spacing:-.4px;line-height:1.2;margin:0 0 6px}
.desc{color:var(--text2);font-size:14.5px;margin:0 0 10px}

/* Properti halaman */
.props{margin:6px 0 14px}
.prop{display:flex;align-items:center;min-height:34px;gap:6px}
.pk{display:flex;align-items:center;gap:7px;width:124px;flex:none;color:var(--text2);font-size:14px;padding:4px 6px 4px 0}
.pk svg.i{width:16px;height:16px}
.pv{flex:1;min-width:0;font-size:14px;padding:4px 6px;border-radius:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pv input{border:0;background:none;outline:none;padding:0;width:100%;font-size:14px;min-height:24px}
.pv input[type=date],.pv input[type=time]{width:auto;color:var(--text)}
.pv input::placeholder{color:var(--text3)}
.pv.edit:hover,.pv.edit:focus-within{background:var(--hover)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tx-green)}
.live.off{background:var(--tx-orange)}
.bar{flex:1;max-width:160px;height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tx-green);border-radius:3px}

.callout{display:flex;gap:10px;padding:14px 16px;border-radius:6px;margin:4px 0 18px;font-size:14.5px}
.callout .emo{font-size:19px;line-height:1.3;width:auto}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden}
.stat{padding:12px 10px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat:active,.stat:hover{background:var(--hover)}
.stat b{font-size:24px;font-weight:700;line-height:1.2}
.stat span{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.stat span::before{content:"";width:8px;height:8px;border-radius:2px}
.stat.k-todo span::before{background:var(--tx-blue)} .stat.k-task span::before{background:var(--tx-purple)}
.stat.k-note span::before{background:var(--tx-orange)} .stat.k-done span::before{background:var(--tx-green)}

.newrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.newbtn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;font-size:14px;font-weight:500;color:var(--text2);border:1px solid var(--line)}
.newbtn:hover,.newbtn:active{background:var(--hover)}
.newbtn svg.i{width:16px;height:16px;stroke-width:2}
.newbtn.k-todo svg.i{color:var(--tx-blue)} .newbtn.k-task svg.i{color:var(--tx-purple)} .newbtn.k-note svg.i{color:var(--tx-orange)}

.h2{display:flex;align-items:center;gap:6px;margin:22px 0 6px -4px;font-size:20px;font-weight:650;letter-spacing:-.2px;width:calc(100% + 4px)}
.h2 .caret{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--text2);transition:transform .15s}
.h2 .caret svg.i{width:14px;height:14px;fill:currentColor;stroke:none}
.h2.closed .caret{transform:rotate(-90deg)}
.h2 .cnt{color:var(--text3);font-size:14px;font-weight:500;margin-left:2px}
.h2 .more{margin-left:auto;color:var(--text2);font-size:13.5px;font-weight:500;padding:3px 6px;border-radius:4px}
.h2 .more:hover{background:var(--hover)}
.sec.closed{display:none}

.tag{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:3px;font-size:12.5px;font-weight:500;white-space:nowrap;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;opacity:.7;flex:none}

/* Blok to-do */
.blk{display:flex;align-items:flex-start;gap:10px;padding:7px 6px;border-radius:5px;width:100%;cursor:pointer}
.blk:hover,.blk:active{background:var(--hover)}
.cb{width:18px;height:18px;border:1.5px solid var(--text2);border-radius:3px;flex:none;display:grid;place-items:center;margin-top:3px;color:#fff;background:var(--bg)}
.cb svg.i{width:13px;height:13px;stroke-width:3;opacity:0}
.done>.cb,.cb.on{background:var(--accent);border-color:var(--accent)}
.done>.cb svg.i,.cb.on svg.i{opacity:1}
.blk-main{flex:1;min-width:0}
.blk-title{font-size:15.5px;word-break:break-word}
.done .blk-title{text-decoration:line-through;text-decoration-color:var(--text3);color:var(--text3)}
.pline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:var(--text2)}
.pi{display:inline-flex;align-items:center;gap:4px}
.pi svg.i{width:13px;height:13px}
.late{color:var(--tx-red);font-weight:500}
.blk>.tag{margin-top:2px}

/* Baris database */
.dbrow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:5px;border-bottom:1px solid var(--line);width:100%;cursor:pointer}
.dbrow:last-child{border-bottom:0}
.dbrow:hover,.dbrow:active{background:var(--hover)}
.emo{font-size:18px;line-height:1;width:22px;text-align:center;flex:none}
.dbrow .blk-title{font-weight:500}
.pinbtn{width:30px;height:30px;border-radius:4px;display:grid;place-items:center;color:var(--text3);flex:none}
.pinbtn:hover{background:var(--hover)}
.pinbtn.on{color:var(--text)}
.pinbtn.on svg.i{fill:currentColor}
.pinbtn svg.i{width:17px;height:17px}
.mini{display:inline-flex;align-items:center;gap:5px}
.mini .bar{width:44px;height:4px;flex:none}
.mini .bar i{background:var(--tx-purple)}

.views{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 12px;overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.views button{display:flex;align-items:center;gap:6px;padding:7px 8px 9px;font-size:14px;color:var(--text2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.views button svg.i{width:16px;height:16px}
.views button.on{color:var(--text);border-bottom-color:var(--text);font-weight:500}

.grp{display:flex;align-items:center;gap:8px;margin:16px 0 4px;padding:0 6px}
.grp:first-child{margin-top:4px}
.grp .n{color:var(--text3);font-size:13px}

/* Board */
.board{display:flex;gap:10px;overflow-x:auto;padding:2px 20px 12px;margin:0 -20px;scroll-snap-type:x mandatory;scroll-padding:0 20px}
.col{flex:0 0 76%;max-width:280px;scroll-snap-align:start;border-radius:8px;padding:8px;min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}
.col-h .n{color:var(--text3);font-size:13px}
.bcard{display:block;width:100%;background:var(--bg);border-radius:6px;box-shadow:rgba(15,15,15,.08) 0 0 0 1px,rgba(15,15,15,.06) 0 2px 4px;padding:10px 10px 9px;margin-bottom:8px;cursor:pointer}
.bcard .t{display:flex;gap:6px;font-weight:500;font-size:14.5px;line-height:1.35}
.bcard .pline{margin-top:7px}
.add-in-col{display:flex;align-items:center;gap:6px;color:var(--text3);font-size:14px;padding:6px;border-radius:4px;width:100%}
.add-in-col:hover{background:var(--hover)}
.add-in-col svg.i{width:16px;height:16px}

/* Gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;border-radius:6px;overflow:hidden;box-shadow:rgba(15,15,15,.1) 0 0 0 1px;background:var(--bg);text-align:left;cursor:pointer}
.gcard:active{opacity:.85}
.gprev{height:108px;padding:10px 12px;font-size:11.5px;line-height:1.45;color:var(--text2);overflow:hidden;white-space:pre-line;position:relative}
.gprev::after{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(transparent,var(--fade))}
.gfoot{padding:8px 12px 10px;border-top:1px solid var(--line)}
.gfoot .t{display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gfoot .t .emo{font-size:15px;width:auto}
.gfoot small{color:var(--text3);font-size:12px;display:flex;align-items:center;gap:5px}
.gfoot small svg.i{width:12px;height:12px}

/* Kartu di mode gelap: garis, bukan bayangan */
:root[data-theme="dark"] :is(.bcard,.gcard){box-shadow:none;border:1px solid var(--line)}
:root[data-theme="dark"] .bcard,:root[data-theme="dark"] .compose{background:var(--bg2)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) :is(.bcard,.gcard){box-shadow:none;border:1px solid var(--line)}
  :root:not([data-theme="light"]) .bcard,:root:not([data-theme="light"]) .compose{background:var(--bg2)}
}

/* Statistik mingguan */
.stats.three{grid-template-columns:repeat(3,1fr);margin-bottom:10px}
.stats.three span::before{display:none}
.stats.three .tag{align-self:flex-start;margin:4px 0 3px}
.delta{font-size:11.5px;color:var(--text3);line-height:1.35;margin-top:2px}
.chart{margin:0 0 6px;padding:12px 10px 8px;border:1px solid var(--line);border-radius:6px}
.chart-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text2);padding:0 2px 10px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);height:100px;align-items:end;border-bottom:1px solid var(--line2)}
.bc{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 2px;cursor:pointer}
.bc i{display:block;width:62%;max-width:28px;background:var(--tx-green);border-radius:4px 4px 0 0}
.bc .v{font-size:12px;color:var(--text2);margin-bottom:3px;font-variant-numeric:tabular-nums;min-height:16px}
@media (hover:hover){.bars:hover .bc:not(:hover) i{opacity:.5}}
.bars.touched .bc:not(.act) i{opacity:.5}
.xl{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--text3);padding-top:5px}
.xl .now{color:var(--text);font-weight:600}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#tip{position:fixed;z-index:60;background:var(--bg);color:var(--text);box-shadow:var(--shadow);border-radius:6px;padding:7px 10px;font-size:12.5px;line-height:1.45;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}
#tip.on{opacity:1}
#tip small{color:var(--text2);font-size:12px}
.empty{color:var(--text3);font-size:14px;padding:8px 6px}
.empty-big{text-align:center;color:var(--text2);padding:40px 16px;font-size:14px}
.empty-big .e{font-size:40px;display:block;margin-bottom:8px}
.empty-big b{display:block;color:var(--text);font-size:15px;margin-bottom:2px}

/* ---------- Nav bawah & tombol tulis ---------- */
.nav{position:fixed;z-index:24;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:var(--text3);font-size:11.5px;font-weight:500}
.nav button svg.i{width:23px;height:23px}
.nav button.on{color:var(--text)}
.nav button.on svg.i{stroke-width:2.2}
.compose{position:fixed;z-index:25;right:max(16px,calc(50% - 340px + 16px));bottom:calc(80px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--bg);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow)}
.compose svg.i{width:23px;height:23px}
.compose:active{transform:scale(.95)}

/* ---------- Sheet / page peek ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:90vh;overflow:auto;border-radius:12px 12px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom));animation:up .2s ease}
.sheet.full{height:100%;max-height:none;border-radius:0;padding-top:env(safe-area-inset-top)}
@media (min-width:700px){.scrim{align-items:center}.sheet.full{height:92vh;border-radius:12px}.sheet{border-radius:12px}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 8px}
.sbar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:4px;height:48px;padding:0 8px}
.sbar .crumb{padding-left:2px}
.saved{color:var(--text3);font-size:12.5px;margin-right:4px;opacity:0;transition:opacity .2s}
.saved.on{opacity:1}
.txtbtn{padding:6px 10px;border-radius:6px;font-size:14.5px;font-weight:600;color:var(--accent)}
.txtbtn:hover{background:var(--accent-soft)}
.sbody{padding:0 20px}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@keyframes fade{from{opacity:0}}

.icon-pick{font-size:44px;line-height:1;padding:4px;border-radius:6px;margin:10px 0 2px -4px}
.icon-pick:hover{background:var(--hover)}
.emoji-row{display:flex;gap:2px;flex-wrap:wrap;margin:0 0 8px;padding:6px;border-radius:6px;box-shadow:var(--shadow);background:var(--bg)}
.emoji-row[hidden]{display:none}
.emoji-row button{font-size:22px;width:38px;height:38px;border-radius:5px;text-align:center}
.emoji-row button:hover{background:var(--hover)}
.title-in{width:100%;border:0;outline:none;background:none;font-size:30px;font-weight:700;letter-spacing:-.3px;line-height:1.2;resize:none;padding:8px 0 4px;overflow:hidden;display:block}
.title-in::placeholder{color:var(--text3)}
.opts{display:flex;gap:4px;flex-wrap:wrap}
.opt{opacity:.5}
.opt:hover{opacity:.8}
.opt.on{opacity:1;box-shadow:0 0 0 1.5px var(--text2)}
.swatch{width:24px;height:24px;border-radius:5px;border:1px solid var(--line2)}
.swatch.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.divider{height:1px;background:var(--line);margin:10px 0 12px}
.body-in{width:100%;border:0;outline:none;background:none;font-size:15.5px;line-height:1.6;resize:none;min-height:200px;padding:0;display:block}
.body-in::placeholder{color:var(--text3)}
.label{color:var(--text2);font-size:13px;font-weight:600;margin:14px 0 4px}
.sub{display:flex;align-items:flex-start;gap:10px;padding:4px 6px;border-radius:4px}
.sub:hover{background:var(--hover)}
.sub input{flex:1;border:0;outline:none;background:none;font-size:15px;padding:1px 0;min-width:0}
.sub.done input{text-decoration:line-through;color:var(--text3)}
.sub .x{color:var(--text3);width:24px;height:24px;display:grid;place-items:center;border-radius:4px}
.sub .x svg.i{width:15px;height:15px}
.add-row{display:flex;align-items:center;gap:10px;padding:5px 6px;color:var(--text3);border-radius:4px}
.add-row svg.i{width:18px;height:18px}
.add-row input{flex:1;border:0;outline:none;background:none;font-size:15px}
.add-row input::placeholder{color:var(--text3)}

/* Menu daftar */
.menu-h{color:var(--text2);font-size:12.5px;font-weight:600;padding:12px 20px 4px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 20px;font-size:15px;cursor:pointer}
.mrow:hover,.mrow:active{background:var(--hover)}
.mrow .ico{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:17px}
.mrow .ico svg.i{width:18px;height:18px}
.mrow .tx{flex:1;min-width:0}
.mrow .tx small{display:block;color:var(--text2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tx b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.red{color:var(--tx-red)}
.search-in{display:flex;align-items:center;gap:10px;margin:0 16px 6px;padding:0 12px;border-radius:8px;background:var(--hover)}
.search-in input{flex:1;border:0;background:none;outline:none;padding:11px 0;font-size:16px}
.search-in svg.i{color:var(--text2)}

/* Kalender */
.cal{padding:0 12px}
.cal-h{display:flex;align-items:center;gap:4px;padding:4px 4px 8px 8px}
.cal-h b{flex:1;font-size:17px;font-weight:650}
.chip-btn{padding:4px 8px;border-radius:5px;font-size:13.5px;color:var(--text2);border:1px solid var(--line)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-grid .dow{font-size:12px;color:var(--text2);padding:6px 0;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{height:54px;padding:4px 5px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day.out{background:var(--bg2);color:var(--text3)}
.day .num{width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.today .num{background:var(--today);color:#fff;font-weight:600}
.day.sel{background:var(--accent-soft)}
.day .dots{display:flex;gap:3px;align-self:flex-start;margin-top:auto}
.day .dots i{width:6px;height:6px;border-radius:50%}

.toast{position:fixed;z-index:80;left:50%;bottom:calc(146px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#2f2f2f;color:#fff;padding:10px 14px;border-radius:6px;font-size:14px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:.18s;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:#62aef0;font-weight:600}

@media (max-width:360px){ .pk{width:112px} h1.title{font-size:28px} .stat b{font-size:21px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(() => {
'use strict';

/* ---------- Ikon (garis tipis, monokrom) ---------- */
const P = {

  notes:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  compose:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',

  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  check:'<path d="m5 12 5 5L20 7"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>', chevR:'<path d="m9 18 6-6-6-6"/>',
  caret:'<path d="M6 9l6 6 6-6z"/>',
  download:'<path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/>',
  upload:'<path d="M12 21V9m0 0-4 4m4-4 4 4M5 3h14"/>',
  tag:'<path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><path d="M7 7h.01"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>',
  status:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
  wifi:'<path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>',
  palette:'<circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.56-2.5 5.56-5.55C21.97 6.01 17.46 2 12 2z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  progress:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',
  repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
};
const I = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ---------- Util ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 864e5);
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtLong = d => d.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fmtShort = s => parseD(s).toLocaleDateString('id-ID', {day:'numeric', month:'short'});
const fmtDay = s => parseD(s).toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'});
const isAndroid = typeof window.AndroidBridge !== 'undefined';

/* Pemetaan semantik → warna palet (lihat komentar color theory di <head>) */
const PRIO = {tinggi:{l:'Tinggi', c:'red'}, sedang:{l:'Sedang', c:'yellow'}, rendah:{l:'Rendah', c:'gray'}};
const PRIO_RANK = {tinggi:0, sedang:1, rendah:2};
const STATUS = {belum:{l:'Belum mulai', c:'gray'}, proses:{l:'Dikerjakan', c:'blue'}, selesai:{l:'Selesai', c:'green'}};
const REPEAT = {none:{l:'Tidak', s:'', c:'default'}, daily:{l:'Harian', s:'Harian', c:'default'}, weekdays:{l:'Hari kerja', s:'Hari kerja', c:'default'}, weekly:{l:'Mingguan', s:'Mingguan', c:'default'}, monthly:{l:'Bulanan', s:'Bulanan', c:'default'}};
const NOTE_COLORS = ['default','gray','brown','orange','yellow','green','blue','purple','pink','red'];
const CAT_COLORS = ['blue','purple','orange','green','pink','brown','yellow','red','gray'];
const CATS = ['Kerja','Pribadi','Belanja','Kuliah','Lainnya'];
const EMOJIS = ['📝','💡','📌','📋','🎯','📊','🛒','📞','💰','📅','⭐','🚀','📦','🧾','🗂️','✏️','📚','❤️'];
const catColor = name => { if (!name) return 'default'; let h = 0; for (const ch of name.toLowerCase()) h = (h*31 + ch.charCodeAt(0)) >>> 0; return CAT_COLORS[h % CAT_COLORS.length]; };
const tag = (label, color, dot) => `<span class="tag c-${color}${dot?' dot':''}">${esc(label)}</span>`;

/* ---------- Data ---------- */
const KEY = 'kerjaku.v1';
let S;
function seed() {
  const t = today(), now = new Date().toISOString();
  return {
    todos: [
      {id:uid(), title:'Buat laporan kasir', date:t, time:'16:00', cat:'Kerja', prio:'tinggi', done:false, repeat:'none', created:now},
      {id:uid(), title:'Cek laporan keuangan', date:t, time:'19:30', cat:'Kerja', prio:'sedang', done:false, repeat:'daily', created:now},
      {id:uid(), title:'Kirim dokumen', date:t, time:'14:00', cat:'Kerja', prio:'tinggi', done:false, repeat:'none', created:now},
      {id:uid(), title:'Belanja kebutuhan kantor', date:addDays(t,1), time:'10:00', cat:'Belanja', prio:'rendah', done:false, repeat:'none', created:now},
      {id:uid(), title:'Rapat mingguan tim', date:t, time:'09:00', cat:'Kerja', prio:'sedang', done:true, doneAt:now, repeat:'weekly', created:now},
    ],
    tasks: [
      {id:uid(), icon:'📊', title:'Rekap penjualan bulanan', desc:'Gabungkan data kasir semua cabang lalu kirim ke manajer.', date:addDays(t,3), time:'17:00', prio:'tinggi', pinned:true, status:'proses', done:false,
        subs:[{id:uid(),t:'Ambil data cabang A',done:true},{id:uid(),t:'Ambil data cabang B',done:true},{id:uid(),t:'Susun tabel rekap',done:false},{id:uid(),t:'Kirim ke manajer',done:false}], created:now},
      {id:uid(), icon:'🚀', title:'Presentasi klien baru', desc:'Siapkan slide penawaran dan simulasi harga.', date:addDays(t,5), time:'10:00', prio:'sedang', pinned:true, status:'belum', done:false,
        subs:[{id:uid(),t:'Draft slide',done:false},{id:uid(),t:'Simulasi harga',done:false}], created:now},
    ],
    notes: [
      {id:uid(), icon:'💡', title:'Ide promo akhir tahun', body:'• Diskon 20% member\n• Bundling produk terlaris\n• Voucher belanja berikutnya', color:'yellow', pinned:true, folder:'Ide', updated:now},
      {id:uid(), icon:'📝', title:'Catatan rapat', body:'Target bulan depan naik 10%.\nFollow up vendor kemasan hari Kamis.', color:'blue', pinned:false, folder:'Rapat', updated:now},
    ],
    settings: {theme:'system', name:'', remind:false, seenNotif:'', collapsed:{}, taskView:'board'},
    fired: {},
  };
}
/* Menyesuaikan data versi 1 (dan cadangan lama) ke model versi 2 */
function migrate(d) {
  for (const t of d.tasks) {
    t.subs ||= []; t.icon ||= '📋'; t.desc ||= ''; t.title ||= '';
    if (!STATUS[t.status]) t.status = t.done ? 'selesai' : t.subs.some(s => s.done) ? 'proses' : 'belum';
    t.done = t.status === 'selesai';
  }
  for (const n of d.notes) { n.icon ||= '📝'; n.title ||= ''; n.body ||= ''; n.folder ||= ''; if (!NOTE_COLORS.includes(n.color)) n.color = 'default'; n.updated ||= new Date().toISOString(); }
  for (const t of d.todos) { t.title ||= ''; if (!PRIO[t.prio]) t.prio = 'sedang'; if (!REPEAT[t.repeat]) t.repeat = 'none'; }
  return d;
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw), base = seed();
      return migrate(Object.assign(base, {todos:[],tasks:[],notes:[],fired:{}}, d, {settings:Object.assign(base.settings, d.settings||{})}));
    }
  } catch (e) {}
  return seed();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Gagal menyimpan data di perangkat'); }
  clearTimeout(save._t); save._t = setTimeout(syncAlarms, 400);
}
S = load();

/* ---------- Tema ---------- */
const mq = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => S.settings.theme === 'dark' || (S.settings.theme === 'system' && mq.matches);
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const dark = isDark();
  $('#theme-color').setAttribute('content', dark ? PALETTE.dark.base.bg : PALETTE.light.base.bg);
  if (isAndroid) { try { window.AndroidBridge.setTheme(dark); } catch (e) {} }
}
mq.addEventListener?.('change', applyTheme);
applyTheme();

/* ---------- State tampilan ---------- */
let tab = 'home';
const view = { todoFilter:'aktif', noteFolder:'' };
try { const t = sessionStorage.getItem('kerjaku.tab'); if (t) tab = t; } catch (e) {}

/* ---------- Komponen ---------- */
const sortTodos = arr => arr.slice().sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999') || (a.time||'99').localeCompare(b.time||'99') || PRIO_RANK[a.prio]-PRIO_RANK[b.prio]);
const sortTasks = arr => arr.slice().sort((a,b) => (a.done-b.done) || (b.pinned-a.pinned) || (a.date||'9999').localeCompare(b.date||'9999') || PRIO_RANK[a.prio]-PRIO_RANK[b.prio]);
const sortNotes = arr => arr.slice().sort((a,b) => (b.pinned-a.pinned) || b.updated.localeCompare(a.updated));
const isLateTodo = x => !x.done && x.date && (x.date < today() || (x.date === today() && x.time && x.time < nowHM()));
const prioTag = p => tag(PRIO[p].l, PRIO[p].c, true);

/* ---------- To Do berulang ---------- */
function nextDate(from, rule) {
  const d = parseD(from);
  if (rule === 'daily') d.setDate(d.getDate() + 1);
  else if (rule === 'weekdays') { do d.setDate(d.getDate() + 1); while (d.getDay() === 0 || d.getDay() === 6); }
  else if (rule === 'weekly') d.setDate(d.getDate() + 7);
  else if (rule === 'monthly') { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
  return ymd(d);
}
/* Mencentang To Do berulang membuat jadwal berikutnya; membatalkan centang menariknya kembali. */
function setTodoDone(x, done) {
  x.done = done;
  x.doneAt = done ? new Date().toISOString() : null;
  let msg = done ? 'Selesai ✓' : null;
  if (done && x.repeat && x.repeat !== 'none' && !x.spawned) {
    let nd = nextDate(x.date || today(), x.repeat);
    while (nd < today()) nd = nextDate(nd, x.repeat);
    const copy = {...x, id:uid(), date:nd, done:false, doneAt:null, spawned:null, created:new Date().toISOString()};
    S.todos.push(copy); x.spawned = copy.id;
    msg = `Selesai ✓ · berikutnya ${fmtShort(nd)}`;
  } else if (!done && x.spawned) {
    const i = S.todos.findIndex(t => t.id === x.spawned && !t.done);
    if (i >= 0) S.todos.splice(i, 1);
    x.spawned = null;
  }
  return msg;
}
function setTaskStatus(x, st) {
  const wasDone = x.status === 'selesai';
  x.status = st; x.done = st === 'selesai';
  if (x.done && !wasDone) x.doneAt = new Date().toISOString();
  if (!x.done) x.doneAt = null;
}

function todoBlock(x, showDate) {
  const late = isLateTodo(x), bits = [];
  if (showDate && x.date && x.date !== today()) bits.push(`<span class="pi">${I('calendar')}${esc(fmtShort(x.date))}</span>`);
  if (x.time) bits.push(`<span class="pi">${I('clock')}${esc(x.time)}</span>`);
  if (x.repeat && x.repeat !== 'none') bits.push(`<span class="pi">${I('repeat')}${REPEAT[x.repeat].s}</span>`);
  if (x.cat) bits.push(tag(x.cat, catColor(x.cat)));
  if (late) bits.push('<span class="late">Terlambat</span>');
  return `<div class="blk ${x.done?'done':''}" data-act="edit-todo" data-id="${x.id}" role="button" tabindex="0">
    <button class="cb" data-act="toggle-todo" data-id="${x.id}" aria-label="${x.done?'Tandai belum selesai':'Tandai selesai'}">${I('check')}</button>
    <div class="blk-main"><div class="blk-title">${esc(x.title || 'Tanpa judul')}</div>${bits.length?`<div class="pline">${bits.join('')}</div>`:''}</div>
    ${x.done ? '' : prioTag(x.prio)}</div>`;
}
function dueText(x) {
  if (!x.date) return '';

  const d = diffDays(x.date, today());
  const label = d < 0 ? `lewat ${-d} hari` : d === 0 ? 'hari ini' : d === 1 ? 'besok' : `${d} hari lagi`;
  return `<span class="pi ${d<=1?'late':''}">${I('calendar')}${esc(fmtShort(x.date))} · ${label}</span>`;
}

/* ---------- Statistik mingguan ---------- */
function weekStats() {
  const t = today(), now = parseD(t);
  const mon = addDays(t, -((now.getDay() + 6) % 7));
  const done = [
    ...S.todos.filter(x => x.doneAt).map(x => ({d:ymd(new Date(x.doneAt)), k:'todo', cat:x.cat})),
    ...S.tasks.filter(x => x.doneAt).map(x => ({d:ymd(new Date(x.doneAt)), k:'task'})),
  ];
  const days = [...Array(7)].map((_, i) => {
    const d = addDays(mon, i), list = done.filter(c => c.d === d);
    return {d, todo:list.filter(c => c.k === 'todo').length, task:list.filter(c => c.k === 'task').length, total:list.length};
  });
  const total = days.reduce((a, b) => a + b.total, 0);
  const lastMon = addDays(mon, -7);
  const last = done.filter(c => c.d >= lastMon && c.d < mon).length;
  const daySet = new Set(done.map(c => c.d));
  let streak = 0, cur = daySet.has(t) ? t : addDays(t, -1);
  while (daySet.has(cur)) { streak++; cur = addDays(cur, -1); }
  const cats = {};
  for (const c of done) if (c.k === 'todo' && c.cat && c.d >= mon) cats[c.cat] = (cats[c.cat] || 0) + 1;
  const top = Object.entries(cats).sort((a, b) => b[1] - a[1])[0];
  return {days, total, last, streak, top, mon};
}
function renderWeek() {
  const w = weekStats(), t = today();
  const max = Math.max(...w.days.map(d => d.total), 1);
  const peak = w.days.reduce((a, b) => b.total > a.total ? b : a, w.days[0]);
  const diff = w.total - w.last;
  const dn = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
  const tipOf = d => `<b>${esc(fmtDay(d.d))}</b><br><small>${d.d > t ? 'Belum terjadi' : d.total ? `${d.total} selesai · ${d.todo} To Do, ${d.task} Tugas` : 'Belum ada yang selesai'}</small>`;
  return `<div class="stats three">
      <div class="stat"><b>${w.total}</b><span>Selesai</span><span class="delta">${diff === 0 ? '= minggu lalu' : `${diff > 0 ? '▲' : '▼'} ${Math.abs(diff)} vs minggu lalu`}</span></div>
      <div class="stat"><b>${w.streak}</b><span>Hari beruntun</span><span class="delta">${w.streak ? '🔥 pertahankan' : 'mulai hari ini'}</span></div>
      <div class="stat">${w.top ? tag(w.top[0], catColor(w.top[0])) : '<b>—</b>'}<span>Teratas</span>${w.top ? `<span class="delta">${w.top[1]} To Do</span>` : ''}</div>
    </div>
    <figure class="chart">
      <div class="chart-h"><span>Pekerjaan selesai per hari</span><span>${esc(fmtShort(w.mon))} – ${esc(fmtShort(addDays(w.mon, 6)))}</span></div>
      <div class="bars" aria-hidden="true">${w.days.map(d => `<div class="bc" data-tip="${esc(tipOf(d))}"><span class="v">${d === peak && d.total ? d.total : ''}</span><i style="height:${d.total ? Math.max(4, d.total / max * 80) : 0}px"></i></div>`).join('')}</div>
      <div class="xl" aria-hidden="true">${w.days.map((d, i) => `<span class="${d.d === t ? 'now' : ''}">${dn[i]}</span>`).join('')}</div>
      <table class="sr-only"><caption>Pekerjaan selesai per hari minggu ini</caption><tr><th>Hari</th><th>To Do</th><th>Tugas</th><th>Total</th></tr>${w.days.map(d => `<tr><td>${esc(fmtDay(d.d))}</td><td>${d.todo}</td><td>${d.task}</td><td>${d.total}</td></tr>`).join('')}</table>
    </figure>`;
}
/* Tooltip grafik: hover di desktop, ketuk di layar sentuh */
function showTip(bar) {
  const tip = $('#tip');
  tip.innerHTML = bar.dataset.tip;
  const r = bar.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  const bx = bar.querySelector('i').getBoundingClientRect();
  const x = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, innerWidth - tw - 8));
  const top = (bx.height ? bx.top : r.bottom) - th - 8;
  tip.style.left = x + 'px'; tip.style.top = Math.max(8, top) + 'px';
  tip.classList.add('on');
  document.querySelectorAll('.bc.act').forEach(b => b.classList.remove('act'));
  bar.classList.add('act');
}
function hideTip() {
  $('#tip').classList.remove('on');
  document.querySelectorAll('.bc.act').forEach(b => b.classList.remove('act'));
  document.querySelectorAll('.bars.touched').forEach(b => b.classList.remove('touched'));
}
document.addEventListener('pointerover', e => { const b = e.target.closest?.('.bc'); if (b && e.pointerType === 'mouse') showTip(b); });
document.addEventListener('pointerout', e => { if (e.pointerType === 'mouse' && e.target.closest?.('.bars') && !e.relatedTarget?.closest?.('.bars')) hideTip(); });
document.addEventListener('click', e => {
  const b = e.target.closest('.bc');
  if (b) { b.parentElement.classList.add('touched'); showTip(b); } else hideTip();
}, true);
addEventListener('scroll', hideTip, {passive:true});

/* Cover memakai gradasi warna analog sesuai waktu: pagi kuning→oranye, siang biru→toska,
   sore oranye→merah muda, malam indigo→ungu. */
function timeOfDay() {
  const h = new Date().getHours();
  if (h >= 4 && h < 11) return {g:'Good Morning', e:'☀️', cover:'linear-gradient(120deg,#fde9b5 0%,#f9c98a 55%,#f4a97a 100%)'};
  if (h >= 11 && h < 15) return {g:'Good Afternoon', e:'🌤️', cover:'linear-gradient(120deg,#d6ecf7 0%,#a9d6e8 55%,#8cc9c4 100%)'};
  if (h >= 15 && h < 18) return {g:'Good Evening', e:'🌇', cover:'linear-gradient(120deg,#fbd5b3 0%,#f1aa9b 55%,#d98aa6 100%)'};
  return {g:'Good Night', e:'🌙', cover:'linear-gradient(120deg,#25284d 0%,#3e3a72 50%,#6a4f93 100%)'};
}

const pageHead = (icon, title, desc) => `<div class="page"><div class="page-icon solo">${icon}</div><h1 class="title">${title}</h1><p class="desc">${desc}</p>`;
function renderTodo() {
  const f = view.todoFilter, t = today();
  const items = sortTodos(S.todos.filter(x => f === 'selesai' ? x.done : f === 'hari' ? !x.done && x.date && x.date <= t : !x.done));
  const groups = new Map();
  for (const x of items) {
    let g, c;
    if (f === 'selesai') { g = 'Selesai'; c = 'green'; }
    else if (!x.date) { g = 'Tanpa tanggal'; c = 'default'; }
    else if (x.date < t) { g = 'Terlambat'; c = 'red'; }
    else if (x.date === t) { g = 'Hari ini'; c = 'blue'; }
    else if (x.date === addDays(t,1)) { g = 'Besok'; c = 'purple'; }
    else { g = fmtDay(x.date); c = 'gray'; }
    if (!groups.has(g)) groups.set(g, {c, arr:[]});
    groups.get(g).arr.push(x);
  }
  const body = items.length
    ? [...groups].map(([g, {c, arr}]) => `<div class="grp">${tag(g, c)}<span class="n">${arr.length}</span></div>${arr.map(x=>todoBlock(x, f==='selesai')).join('')}`).join('')

/* ---------- Overlay ---------- */
const stack = [];
let replaceNext = false;
function openSheet(html, {full=false, onMount, onClose}={}) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet ${full?'full':''}" role="dialog" aria-modal="true">${full?'':'<div class="grab"></div>'}${html}</div>`;
  scrim.addEventListener('click', e => { if (e.target === scrim) closeTop(); });
  scrim._onClose = onClose;
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  if (replaceNext && stack.length) { const old = stack.pop(); old._onClose && old._onClose(); old.remove(); stack.push(scrim); history.replaceState({sheet: stack.length}, ''); }
  else { stack.push(scrim); history.pushState({sheet: stack.length}, ''); }
  replaceNext = false;
  onMount && onMount(scrim.firstElementChild);
  return scrim.firstElementChild;
}
function removeTop() {
  const el = stack.pop();
  if (el) { el._onClose && el._onClose(); el.remove(); }
  if (!stack.length) document.body.style.overflow = '';
}
function closeTop() { if (stack.length) history.back(); }
window.addEventListener('popstate', e => { const want = (e.state && e.state.sheet) || 0; while (stack.length > want) removeTop(); });
function closeAll() { const n = stack.length; if (n) history.go(-n); }
const sbar = (crumb, right='') => `<div class="sbar"><button class="ib" data-act="close" aria-label="Tutup">${I('x')}</button><div class="crumb"><span class="cur">${crumb}</span></div><span class="saved">Tersimpan</span>${right}</div>`;

function editor(kind, id, preset={}) {
  const arr = S[kind];

  const defaults = {
    todos: {title:'', date:today(), time:'', cat:'Kerja', prio:'sedang', done:false, repeat:'none'},
    tasks: {icon:'📋', title:'', desc:'', date:addDays(today(),1), time:'', prio:'sedang', pinned:false, status:'belum', done:false, subs:[]},
    notes: {icon:'📝', title:'', body:'', color:'default', pinned:false, folder:''},
  }[kind];
  const x = existing || Object.assign({id:uid(), created:new Date().toISOString(), updated:new Date().toISOString()}, JSON.parse(JSON.stringify(defaults)), preset);
  if (kind === 'tasks') x.done = x.status === 'selesai';
  let inserted = !!existing;
  const label = {todos:'To Do', tasks:'Tugas', notes:'Notes'}[kind];
  const hasContent = () => x.title.trim() || (kind === 'notes' && x.body.trim());
  let savedTimer;

    if (!inserted) { if (!hasContent()) return; arr.push(x); inserted = true; root.querySelector('[data-act="del"]').hidden = false; }
    save(); render();
    stack.slice(0, -1).forEach(s => s.firstElementChild._refresh && s.firstElementChild._refresh());
    const sv = root.querySelector('.saved'); sv.classList.add('on'); clearTimeout(savedTimer); savedTimer = setTimeout(() => sv.classList.remove('on'), 1200);
  };

  let props;
  if (kind === 'todos') {
    const cats = [...new Set([...CATS, ...S.todos.map(t=>t.cat).filter(Boolean)])];
    props = `
      <div class="prop"><span class="pk">${I('checksq')}Selesai</span><span class="pv"><button type="button" class="cb ${x.done?'on':''}" data-f="done" aria-label="Selesai">${I('check')}</button></span></div>

/* ---------- Inbox ---------- */
function notifications() {
  const t = today(), out = [];
  for (const x of S.todos) {
    if (x.done || !x.date) continue;
    if (isLateTodo(x)) out.push({kind:'late', id:x.id, type:'todo', title:x.title, sub:`Terlambat · ${x.date===t?'hari ini '+x.time:fmtShort(x.date)+(x.time?' '+x.time:'')}`});
    else if (x.date === t) out.push({kind:'soon', id:x.id, type:'todo', title:x.title, sub:`Hari ini${x.time?' pukul '+x.time:''}`});
  }
  for (const x of S.tasks) {
    if (x.done || !x.date) continue;
    const d = diffDays(x.date, t);
    if (d < 0) out.push({kind:'late', id:x.id, type:'task', title:x.title, sub:`Deadline lewat ${-d} hari`});
    else if (d <= 2) out.push({kind:'task', id:x.id, type:'task', title:x.title, sub:`Deadline ${d===0?'hari ini':d===1?'besok':'2 hari lagi'}`});
  }
  return out;
}
const notifSignature = () => notifications().map(n => n.kind + n.id).join('|');

    }).join('') : emptyBig('📭','Inbox kosong','Pengingat To Do hari ini dan deadline tugas muncul di sini.')}`);

function sysNotify(title, body) {
  if (isAndroid) { try { window.AndroidBridge.notify(title, body); } catch (e) {} return; }
  if ('Notification' in window && Notification.permission === 'granted') {
    navigator.serviceWorker?.getRegistration().then(r => r ? r.showNotification(title, {body, icon:'icon-192.png', badge:'icon-192.png'}) : new Notification(title, {body}))
      .catch(() => { try { new Notification(title, {body}); } catch (e) {} });
  }
}
/* Android: jadwalkan alarm sistem agar pengingat muncul walau aplikasi ditutup. */
const canAlarm = () => isAndroid && typeof window.AndroidBridge.scheduleReminders === 'function';
function upcomingReminders() {
  const now = Date.now(), limit = now + 60 * 864e5, out = [];
  const at = (d, t) => { const [y,m,dd] = d.split('-').map(Number), [h,mi] = t.split(':').map(Number); return new Date(y, m-1, dd, h, mi).getTime(); };
  for (const x of S.todos) {
    if (x.done || !x.date || !x.time) continue;
    const ts = at(x.date, x.time);
    if (ts > now && ts < limit) out.push({key:'t:' + x.id, at:ts, title:'⏰ ' + (x.title || 'To Do'), body:`Waktunya sekarang (${x.time}) · ${x.cat || 'To Do'}`});
  }
  for (const x of S.tasks) {
    if (x.done || !x.date) continue;
    const ts = at(x.date, x.time || '09:00');
    if (ts > now && ts < limit) out.push({key:'k:' + x.id, at:ts, title:'📌 Deadline: ' + (x.title || 'Tugas'), body:`Deadline ${x.time ? 'pukul ' + x.time : 'hari ini'} · ${STATUS[x.status].l}`});
  }
  return out.sort((a, b) => a.at - b.at).slice(0, 60);
}
function syncAlarms() {
  if (!canAlarm()) return;
  try { window.AndroidBridge.scheduleReminders(JSON.stringify(S.settings.remind ? upcomingReminders() : [])); } catch (e) {}
}
function checkReminders() {
  if (!S.settings.remind || canAlarm()) return;
  const t = today(), now = nowHM();
  let changed = false;
  for (const x of S.todos) {
    if (x.done || x.date !== t || !x.time || x.time > now) continue;
    const key = x.id + '@' + x.date + x.time;
    if (S.fired[key]) continue;
    S.fired[key] = 1; changed = true;
    sysNotify('⏰ ' + (x.title || 'To Do'), `Waktunya sekarang (${x.time}) · ${x.cat || 'To Do'}`);
  }
  for (const k of Object.keys(S.fired)) if ((k.split('@')[1] || '').slice(0,10) < addDays(t,-7)) { delete S.fired[k]; changed = true; }
  if (changed) save();
}

function exportData() {
  const data = JSON.stringify({app:'KerjaKu', version:2, exported:new Date().toISOString(), todos:S.todos, tasks:S.tasks, notes:S.notes}, null, 2);

function importJson(text) {
  try {
    const d = JSON.parse(text);
    if (!Array.isArray(d.todos) || !Array.isArray(d.tasks) || !Array.isArray(d.notes)) throw 0;
    if (!confirm(`Ganti data sekarang dengan cadangan ini?\n${d.todos.length} To Do, ${d.tasks.length} Tugas, ${d.notes.length} Notes.`)) return;
    migrate(d);
    S.todos = d.todos; S.tasks = d.tasks; S.notes = d.notes;
    commit('Data berhasil dipulihkan'); closeAll();
  } catch (err) { toast('Berkas cadangan tidak valid'); }
}
$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';

});

/* ---------- Simpan + render ---------- */
function commit(msg) {
  save(); render();
  stack.forEach(s => s.firstElementChild._refresh && s.firstElementChild._refresh());
  if (msg) toast(msg);
}
let toastTimer;
function toast(msg, actLabel, act) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actLabel?`<button>${esc(actLabel)}</button>`:''}`;
  if (act) t.querySelector('button').onclick = () => { t.classList.remove('show'); act(); };
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), actLabel ? 5000 : 2000);
}

/* ---------- Event ---------- */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn && !e.target.closest('.sheet')) { setTab(tabBtn.dataset.tab); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id, act = el.dataset.act;
  const fromMenu = () => !!el.closest('.sheet:not(.full)');
  switch (act) {
    case 'toggle-todo': {
      const x = S.todos.find(t => t.id === id);
      commit(setTodoDone(x, !x.done)); break;
    }
    case 'pin-task': {
      const x = S.tasks.find(t => t.id === id); x.pinned = !x.pinned;
      commit(x.pinned ? 'Disematkan ke Home' : 'Pin dilepas'); break;
    }
    case 'collapse': { const k = el.dataset.k; S.settings.collapsed[k] = !S.settings.collapsed[k]; save(); render(); break; }
    case 'edit-todo': replaceNext = fromMenu(); editor('todos', id); break;
    case 'edit-task': replaceNext = fromMenu(); editor('tasks', id); break;
    case 'edit-note': replaceNext = fromMenu(); editor('notes', id); break;
    case 'new-todo': replaceNext = fromMenu(); editor('todos', null, el.dataset.date ? {date:el.dataset.date} : {}); break;
    case 'new-task': replaceNext = fromMenu(); editor('tasks', null, el.dataset.status ? {status:el.dataset.status} : {}); break;
    case 'new-note': replaceNext = fromMenu(); editor('notes', null, tab === 'notes' && view.noteFolder && view.noteFolder !== '-' ? {folder:view.noteFolder} : {}); break;
    case 'note-folder': view.noteFolder = el.dataset.v; render(); break;
    case 'fab': tab === 'todo' ? editor('todos', null) : tab === 'tugas' ? editor('tasks', null) : tab === 'notes' ? editor('notes', null, view.noteFolder && view.noteFolder !== '-' ? {folder:view.noteFolder} : {}) : chooser(); break;
    case 'del': removeItem(el.dataset.kind, id); break;
    case 'todo-filter': view.todoFilter = el.dataset.v; render(); break;
    case 'task-view': S.settings.taskView = el.dataset.v; save(); render(); break;
    case 'show-done': view.todoFilter = 'selesai'; setTab('todo'); break;
    case 'close': closeTop(); break;
    case 'search': searchSheet(); break;
    case 'calendar': calendarSheet(); break;
    case 'notif': notifSheet(); break;
    case 'settings': settingsSheet(); break;
    case 'export': exportData(); break;
    case 'import': $('#import-file').click(); break;
    case 'reset':
      if (confirm('Hapus semua To Do, Tugas, dan Notes? Tindakan ini tidak bisa dibatalkan.')) {
        S.todos = []; S.tasks = []; S.notes = []; S.fired = {}; commit('Semua data dihapus'); closeAll();
      }
      break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && stack.length) closeTop();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); }
});

/* Dipanggil tombol Back Android: true = sudah ditangani */
window.KerjaKu = {
  back() {
    if (stack.length) { closeTop(); return true; }
    if (tab !== 'home') { setTab('home'); return true; }
    return false;
  },
  importJson, toast,
};

window.addEventListener('online', () => { if (!stack.length) render(); });
window.addEventListener('offline', () => { if (!stack.length) render(); });

/* ---------- Isi ikon & mulai ---------- */
$('#mark').innerHTML = I('leaf');
$('[data-act="search"]').insertAdjacentHTML('afterbegin', I('search'));
$('[data-act="calendar"]').insertAdjacentHTML('afterbegin', I('calendar'));
$('[data-act="notif"]').insertAdjacentHTML('afterbegin', I('inbox'));
$('[data-act="settings"]').insertAdjacentHTML('afterbegin', I('gear'));
$('.compose').innerHTML = I('compose');
document.querySelectorAll('[data-ic]').forEach(s => s.outerHTML = I(s.dataset.ic));

render();
checkReminders();
syncAlarms();
setInterval(() => { checkReminders(); if (!stack.length) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (!stack.length) render(); checkReminders(); } });
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });

if ('serviceWorker' in navigator && !isAndroid && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
