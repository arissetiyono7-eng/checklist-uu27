plugins {
    id 'com.android.application'
}

android {
    namespace 'id.kerjaku.app'
    compileSdk 34

    defaultConfig {
        applicationId 'id.kerjaku.app'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '2.2'
    }

    signingConfigs {
        // Kunci debug bersama agar APK dari GitHub Actions bisa di-update tanpa uninstall.
        // Untuk Play Store, ganti dengan keystore pribadi yang tidak di-commit.
        shared {
            storeFile file('../kerjaku-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    // Aplikasi web (folder kerjaku/ di root repo) dipakai langsung sebagai aset APK.
    sourceSets {
        main {
            assets.srcDirs = ['../../kerjaku']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
